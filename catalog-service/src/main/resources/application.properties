# Port HTTP khusus catalog-service
quarkus.http.port=8082

# Database PostgreSQL (lms_catalog)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=lms_admin
quarkus.datasource.password=lms_secret_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/lms_catalog
quarkus.datasource.devservices.enabled=false

# Hibernate & Flyway
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# Verifikasi JWT menggunakan publicKey.pem (disamakan dengan identity-service)
mp.jwt.verify.issuer=https://api.lms-anda.com
mp.jwt.verify.publickey.location=publicKey.pem

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Kafka Producer untuk Domain Catalog (1 Topik = lms.catalog.events)
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.catalog-events.connector=smallrye-kafka
mp.messaging.outgoing.catalog-events.topic=lms.catalog.events
mp.messaging.outgoing.catalog-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.catalog-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer