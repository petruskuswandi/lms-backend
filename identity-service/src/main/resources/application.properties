quarkus.http.port=8081

# Database PostgreSQL untuk identity-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=lms_admin
quarkus.datasource.password=lms_secret_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/lms_identity
quarkus.flyway.migrate-at-start=true

# Google Client ID (sesuaikan dengan Google Cloud Console Anda nanti)
lms.google.client-id=161477907331-i3feo7ucaoufknjr3jbb49svfaupukdj.apps.googleusercontent.com

# Konfigurasi JWT Issuer
mp.jwt.verify.issuer=https://api.lms-anda.com
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Kafka Producer untuk UserRegisteredEvent
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.identity-events.connector=smallrye-kafka
mp.messaging.outgoing.identity-events.topic=lms.identity.events
mp.messaging.outgoing.identity-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.identity-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
