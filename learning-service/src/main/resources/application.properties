# Port HTTP khusus learning-service
quarkus.http.port=8083

# Database PostgreSQL (lms_learning)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=lms_admin
quarkus.datasource.password=lms_secret_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/lms_learning
quarkus.datasource.devservices.enabled=false

# Hibernate & Flyway
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# Verifikasi JWT menggunakan publicKey.pem (disamakan dengan identity-service)
mp.jwt.verify.issuer=https://lms-anda.com
mp.jwt.verify.publickey.location=publicKey.pem

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Kafka Configuration
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=localhost:9092

# Consumer: Membaca event dari catalog-service (lms.catalog.events)
mp.messaging.incoming.catalog-events-in.connector=smallrye-kafka
mp.messaging.incoming.catalog-events-in.topic=lms.catalog.events
mp.messaging.incoming.catalog-events-in.group.id=learning-service-group
mp.messaging.incoming.catalog-events-in.auto.offset.reset=earliest
mp.messaging.incoming.catalog-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer: Mengirim event belajar ke lms.learning.events
mp.messaging.outgoing.learning-events-out.connector=smallrye-kafka
mp.messaging.outgoing.learning-events-out.topic=lms.learning.events
mp.messaging.outgoing.learning-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.learning-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer